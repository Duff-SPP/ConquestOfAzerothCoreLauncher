# Include inside the NEW HTTPS server {} for launcher-api.coa-development.org.
# Master and published roots MUST be different folders. nginx needs read access only.
location = /downloads/launcher/ConquestOfAzerothSetup.exe {
    alias /srv/coa/published/launcher/ConquestOfAzerothSetup.exe;
    default_type application/octet-stream;
    add_header Cache-Control "no-store" always;
    disable_symlinks on;
    gzip off;
    sendfile on;
}
location = /downloads/client/latest.json {
    alias /srv/coa/published/client/latest.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    disable_symlinks on;
}
location ~ ^/downloads/client/objects/([a-f0-9]{64})$ {
    alias /srv/coa/published/client/objects/$1;
    default_type application/octet-stream;
    add_header Cache-Control "public,max-age=31536000,immutable" always;
    add_header X-Content-Type-Options nosniff always;
    gzip off;
    sendfile on;
    disable_symlinks on;
}
location = /downloads/launcher/latest.yml {
    alias /srv/coa/published/launcher/latest.yml;
    default_type text/yaml;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    disable_symlinks on;
}
location ~ ^/downloads/launcher/(ConquestOfAzerothSetup-[0-9]+\.[0-9]+\.[0-9]+\.exe(?:\.blockmap)?)$ {
    alias /srv/coa/published/launcher/$1;
    default_type application/octet-stream;
    add_header Cache-Control "public,max-age=31536000,immutable" always;
    add_header X-Content-Type-Options nosniff always;
    gzip off;
    sendfile on;
    disable_symlinks on;
}
# Prevent directory listing or any other files in published storage becoming public.
location /downloads/ {
    return 404;
}
