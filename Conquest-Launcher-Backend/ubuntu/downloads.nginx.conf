# Include inside the NEW HTTPS server {} for launcher-api.coa-development.org.
# Master and published roots MUST be different folders. nginx needs read access only.
location = /downloads/launcher/ConquestOfAzerothSetup.exe {
    alias /srv/coa/published/launcher/ConquestOfAzerothSetup.exe;
    default_type application/octet-stream;
    add_header Cache-Control "no-store" always;
    disable_symlinks on;
    gzip off;
    sendfile on;
}
# Client files must pass the backend version policy. Never alias them directly.
location ^~ /downloads/client/ {
    proxy_pass http://127.0.0.1:5082;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-CoA-Launcher-Version $http_x_coa_launcher_version;
    proxy_cache off;
    proxy_buffering off;
    proxy_read_timeout 120s;
    add_header Cache-Control "no-store" always;
}
location = /downloads/launcher/latest.yml {
    alias /srv/coa/published/launcher/latest.yml;
    default_type text/yaml;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    disable_symlinks on;
}
location ~ ^/downloads/launcher/(ConquestOfAzerothSetup-[0-9]+\.[0-9]+\.[0-9]+\.exe(?:\.blockmap)?)$ {
    alias /srv/coa/published/launcher/$1;
    default_type application/octet-stream;
    add_header Cache-Control "public,max-age=31536000,immutable" always;
    add_header X-Content-Type-Options nosniff always;
    gzip off;
    sendfile on;
    disable_symlinks on;
}
# Prevent directory listing or any other files in published storage becoming public.
location /downloads/ {
    return 404;
}
