# A NEW server block. Do not replace your website's nginx configuration.
# Add HTTPS with certbot after DNS points launcher-api.coa-development.org at the VPS.
server {
    listen 80;
    listen [::]:80;
    server_name launcher-api.coa-development.org;
    client_max_body_size 64k;
    include /etc/nginx/snippets/coa-launcher-downloads.conf;
    location / {
        proxy_pass http://127.0.0.1:5082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
